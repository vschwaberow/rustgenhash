[package]
name = "rustgenhash"
version = "0.16.0"
license = "MIT"
authors = ["Volker Schwaberow <volker@schwaberow.de>"]
description = "A tool to generate hashes from the command line."
homepage = "https://github.com/vschwaberow/rustgenhash"
repository = "https://github.com/vschwaberow/rustgenhash"
readme = "README.md"
keywords = ["cli", "crypto", "hashes", "rust"]
edition = "2021"
categories = ["command-line-utilities", "cryptography"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "rgh"
path = "src/bin/main.rs"
required-features = ["cli"]

[[bin]]
name = "print_multihash"
path = "scripts/tools/print_multihash.rs"
required-features = ["cli"]

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"

[features]
default = ["std", "cli"]
std = []
cli = ["dep:dialoguer", "dep:rustyline"]
portable-only = ["std"]

[dependencies]
argon2 = { version = "0.6", features = ["password-hash", "rand_core"] }
ascon-hash = "0.4"
balloon-hash = { version = "0.5.0-rc.5", features = ["password-hash", "rand_core", "getrandom"] }
base64 = "0.21"
bcrypt-pbkdf = "0.11"
belt-hash = "0.2"
aes = "0.9"
cmac = "0.8"
cshake = "0.2"
poly1305 = "0.9"
blake2 = "0.11"
blake3 = { version = "1.8", features = ["traits-preview"] }
clap = { version = "4.0.10", features = ["derive", "cargo"] }
clap_complete = "4.0.2"
colored = "2.1.0"
csv = "1.3"
dialoguer = { version = "0.11.0", optional = true }
rustyline = { version = "18.0", optional = true }
digest = { version = "0.11", features = ["alloc", "mac"] }
hmac = "0.13"
hkdf = "0.13"
multibase = "0.9" # Multiformats multibase (https://github.com/multiformats/multibase)
fsb = "0.2"
getrandom = "0.4"
gost94 = "0.11"
groestl = "0.11"
hex = "0.4.3"
jh = "0.2"
memmap2 = "0.9"
md-5 = "0.11"
md2 = "0.11"
md4 = "0.11"
password-hash = { version = "0.6", features = ["alloc", "getrandom", "rand_core"] }
pbkdf2 = { version = "0.13", features = ["password-hash", "phc", "rand_core", "getrandom", "hmac", "sha2"] }
rand = "0.10"
rand_chacha = "0.10"
rand_core = "0.10"
rand_hc = "0.5"
rand_jitter = "0.6"
rand_pcg = "0.10"
rand_xorshift = "0.5"
regex = "1.7.1"
reqwest = { version = "0.12", features = ["blocking"] }
ripemd = "0.2"
rayon = "1.10"
scrypt = { version = "0.12", features = ["password-hash", "phc", "rand_core", "getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yaml_serde = "0.10.4"
sha1 = "0.11"
sha-crypt = "0.6.0"
sha2 = "0.11"
sha3 = "0.12"
shabal = "0.5"
skein = "0.2"
sm3 = "0.5"
streebog = "0.11"
strum = { version = "0.26.3", features = ["derive"] }
tempfile = "3.3.0"
tiger = "0.3"
url = "2.4.1"
uuid = { version = "1.3.0", features = ["v1", "v3", "v4", "v5", "v6", "v7", "v8"] }
whirlpool = "0.11"
walkdir = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
zeroize = "1.7"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.4"
features = ["wasm_js"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.uuid]
version = "1.3.0"
features = ["js"]


